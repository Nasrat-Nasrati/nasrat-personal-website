<!-- templates/myapp/base.html -->
{% load static %} {% load i18n %}
<!DOCTYPE html>
<html
  lang="{{ LANGUAGE_CODE }}"
  dir="{% if LANGUAGE_CODE == 'fa' %}rtl{% else %}ltr{% endif %}"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Nasrat Website{% endblock %}</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="{% static 'css/styles.css' %}" />

    <!-- Add RTL CSS for Persian (Dari) and Pashto -->
    {% if LANGUAGE_CODE == 'fa'%}
    <link rel="stylesheet" href="{% static 'css/rtl.css' %}" />
    {% endif %}
  </head>
  <body>
    <!-- Header -->
    {% include 'mywebsite_app/header.html' %}

    <!-- Content Block -->
    <div class="container mt-4">
      {% block content %}
      <!-- Child templates will override this -->
      {% endblock %}
    </div>

    <!-- Footer -->
    {% include 'mywebsite_app/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
