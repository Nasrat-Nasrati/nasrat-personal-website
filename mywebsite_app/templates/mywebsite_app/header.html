<!-- templates/myapp/header.html -->
{% load i18n %}
{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">{% trans "Nasrat Website" %}</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
      aria-controls="navbarNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav {% if LANGUAGE_CODE == 'fa' %}ms-auto{% else %}me-auto{% endif %}">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'home' %}">{% trans "Home" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'about' %}">{% trans "About" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'projects' %}">{% trans "Projects" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'portfolio' %}">{% trans "Portfolio" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'weblog' %}">{% trans "Weblog" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'contact' %}">{% trans "Contact Us" %}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'download_resume' %}">{% trans "Download Resume" %}</a>
        </li>
      </ul>
      <form class="d-flex" action="{% url 'set_language' %}" method="post">
        {% csrf_token %}
        <select class="form-select me-2" name="language" onchange="this.form.submit()">
          {% get_current_language as LANGUAGE_CODE %}
          {% get_available_languages as LANGUAGES %}
          {% get_language_info_list for LANGUAGES as languages %}
          {% for language in languages %}
            <option value="{{ language.code }}" {% if language.code == LANGUAGE_CODE %}selected{% endif %}>
              {{ language.name_local }}
            </option>
          {% endfor %}
        </select>
      </form>
    </div>
  </div>
</nav>
